# The private dashboard. ⛔ Nothing served here is public: the port is bound to 127.0.0.1 in
# docker-compose.yml, and `tailscale serve` exposes it to the tailnet ALONE.
# Never use `tailscale funnel`: it would open the door onto the internet, with none of the
# protections a public site sits behind.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # No crawler can reach this, but the header costs nothing and covers a link preview
    # generated by a messaging app when the address is shared by mistake.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # ⚠️ THE HTML AND THE STYLESHEET CHANGE TOGETHER. Served with `expires 1h`, the sheet
    # stayed cached while a new page arrived: the new classes did not yet exist on the
    # visitor's side, and an unstyled SVG renders at its default size — 300 × 150 pixels.
    # Enormous icons, seen in practice.
    # These files weigh a few kilobytes on a private network: revalidating costs nothing,
    # a broken page costs a lot.
    location = /donnees.json { add_header Cache-Control "no-store"; }
    location = /index.html   { add_header Cache-Control "no-cache"; }
    location = /style.css    { add_header Cache-Control "no-cache"; }
    # ⚠️ The service worker decides what is served offline: cached, an old copy of it would
    # keep rendering a stale shell long after the page itself was updated.
    location = /sw.js        { add_header Cache-Control "no-cache"; }
    location = /             { add_header Cache-Control "no-cache"; }
    # On-demand recomputation, optional. The ↻ button asks for it; a small service on the host
    # (port 8091, answering the machine itself only) reruns scripts/tableau-de-bord.py. Where that service is not installed,
    # these two addresses answer 502 and the page simply re-reads the figures, as before.
    # The variable and the resolver keep nginx starting even where host.docker.internal does
    # not exist: the name is looked up at request time, not at startup.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $recalcul http://host.docker.internal:8091;
    location = /recalculer    { proxy_pass $recalcul; proxy_read_timeout 15s; }
    location = /etat-recalcul { proxy_pass $recalcul; proxy_read_timeout 15s; }
    # The icons and the manifest, on the other hand, do not change: keep them.
    location / { try_files $uri $uri/ =404; expires 7d; }

    access_log off;
}
